<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Billwise: Invoice and Quotation Maker</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8eeeb;--panel:#fff;--ink:#10231c;--mute:#55665f;--line:#cbd8d2;--acc:#0f8a5f;--acc-ink:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a15;--panel:#16261f;--ink:#e6f2ec;--mute:#93a99f;--line:#28403500;--line:#294036;--acc:#3ccf98;--acc-ink:#0e1a15}}
:root[data-theme="dark"]{--bg:#0e1a15;--panel:#16261f;--ink:#e6f2ec;--mute:#93a99f;--line:#294036;--acc:#3ccf98;--acc-ink:#0e1a15}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif}
.top{max-width:1200px;margin:0 auto;padding:22px 18px 6px;display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.top h1{margin:0;font-size:28px;font-weight:800}
.top span{color:var(--mute);font-size:14px}
.grid{max-width:1200px;margin:0 auto;padding:14px 18px 60px;display:grid;grid-template-columns:minmax(320px,430px) 1fr;gap:22px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 12px;font-weight:800}
label{display:block;font-weight:500;font-size:13px;margin-bottom:10px}
input,select,textarea{display:block;width:100%;margin-top:4px;padding:9px 10px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px}
textarea{resize:vertical;min-height:58px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{display:grid;grid-template-columns:1fr 54px 78px 30px;gap:6px;margin-bottom:6px}
.item input{margin:0}
.btn{background:var(--acc);color:var(--acc-ink);border:0;border-radius:9px;padding:10px 16px;font:700 14px Figtree,sans-serif;cursor:pointer}
.ghost{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:7px 12px;font:600 13px Figtree,sans-serif;cursor:pointer}
.ghost:hover{border-color:var(--acc)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.pro{font-size:10px;font-weight:800;background:#ffb703;color:#10231c;border-radius:4px;padding:1px 5px;margin-left:5px;vertical-align:middle}
.msg{font-size:13px;color:var(--mute);min-height:18px}
.sticky{position:sticky;top:12px}
/* paper */
.paper{background:#fff;color:#111;border-radius:6px;box-shadow:0 6px 30px #0003;padding:38px 36px;min-height:640px;font-size:14px;line-height:1.45;overflow-x:auto}
.paper h2{margin:0;font-size:26px}
.ph{display:flex;justify-content:space-between;gap:20px;margin-bottom:26px}
.ph img{max-height:60px;max-width:180px;display:block;margin-bottom:8px}
.pre{white-space:pre-wrap;color:#444}
.meta{text-align:right}.meta b{display:block;font-size:22px;text-transform:uppercase;letter-spacing:.04em}
.bt{margin-bottom:22px}.bt small{display:block;color:#777}
.paper table{width:100%;border-collapse:collapse}
.paper th{text-align:left;padding:8px 6px;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.paper td{padding:9px 6px;border-bottom:1px solid #e3e3e3;vertical-align:top}
.paper .n{text-align:right;white-space:nowrap}
.tot{margin:16px 0 0 auto;width:min(280px,100%)}
.tot div{display:flex;justify-content:space-between;padding:4px 6px}
.tot .g{font-weight:800;font-size:17px;border-top:2px solid #111;margin-top:6px;padding-top:8px}
.notes{margin-top:28px;color:#555}
.paper[data-t="classic"]{font-family:Georgia,"Times New Roman",serif}
.paper[data-t="classic"] .ph{border-bottom:2px solid #111;padding-bottom:16px}
.paper[data-t="classic"] th{border-bottom:2px solid #111}
.paper[data-t="modern"] .ph{background:var(--pa);color:#fff;margin:-38px -36px 26px;padding:28px 36px;border-radius:6px 6px 0 0}
.paper[data-t="modern"] .ph .pre{color:#ffffffcc}
.paper[data-t="modern"] th{background:#f3f4f6;color:var(--pa)}
.paper[data-t="modern"] .tot .g{border-color:var(--pa);color:var(--pa)}
.paper[data-t="minimal"] h2{font-weight:500}
.paper[data-t="minimal"] th{color:#777;border-bottom:1px solid #111;font-weight:500}
.paper[data-t="minimal"] td{border-bottom:1px solid #eee}
@media (max-width:860px){.grid{grid-template-columns:1fr}.sticky{position:static}.paper{padding:22px 16px}.paper[data-t="modern"] .ph{margin:-22px -16px 20px;padding:20px 16px}}
@media print{
@page{margin:12mm}
body{background:#fff}.top,.editor{display:none!important}
.grid{display:block;padding:0;max-width:none}.paper{box-shadow:none;padding:0;min-height:0}
.paper[data-t="modern"] .ph{margin:0 0 22px;padding:22px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.paper[data-t="modern"] th{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="top"><h1>Billwise</h1><span>Invoices and quotations. Saved on this device.</span></div>
<div class="grid">
<div class="editor">
 <div class="card"><h2>Document</h2>
  <div class="r2"><label>Type<select data-k="type"><option>Invoice</option><option>Quotation</option></select></label><label>Number<input data-k="no"></label></div>
  <div class="r2"><label>Date<input type="date" data-k="date"></label><label><span id="duel">Due date</span><input type="date" data-k="due"></label></div>
  <div class="r2"><label>Template<select data-k="tpl"><option value="classic">Classic</option><option value="minimal">Minimal</option><option value="modern">Modern (Pro)</option></select></label><label>Currency<select data-k="cur"><option>USD</option><option>EUR</option><option>GBP</option><option>BDT</option><option>INR</option></select></label></div>
  <label>Brand color <span class="pro" title="Pro feature, unlocked in this preview">PRO</span><input type="color" data-k="acc"></label>
 </div>
 <div class="card"><h2>Your business</h2>
  <label>Business name<input data-k="biz" placeholder="Acme Studio"></label>
  <label>Address, phone, email<textarea data-k="bizInfo"></textarea></label>
  <label>Logo <span class="pro" title="Pro feature, unlocked in this preview">PRO</span><input type="file" id="logo" accept="image/*"></label>
  <button class="ghost" id="rmlogo">Remove logo</button>
 </div>
 <div class="card"><h2>Customer</h2>
  <label>Saved customers<select id="saved"></select></label>
  <label>Name<input data-k="cust.name"></label>
  <label>Address or email<textarea data-k="cust.info"></textarea></label>
  <button class="ghost" id="savec">Save customer</button>
 </div>
 <div class="card"><h2>Products and services</h2>
  <div id="items"></div>
  <button class="ghost" id="add">Add item</button>
  <div class="r2" style="margin-top:12px"><label>Tax (%)<input type="number" min="0" step="any" data-k="tax"></label>
  <label>Discount<div class="r2" style="margin-top:4px"><input type="number" min="0" step="any" data-k="disc" style="margin:0"><select data-k="dm" style="margin:0"><option>%</option><option>amount</option></select></div></label></div>
  <label>Notes or payment terms<textarea data-k="notes"></textarea></label>
 </div>
 <div class="row"><button class="btn" id="print">Print or save as PDF</button><button class="ghost" id="next">Finish and start next</button></div>
 <p class="msg" id="msg"></p>
</div>
<div class="sticky"><div class="paper" id="paper"></div></div>
</div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const K="billwise-v1",today=new Date().toISOString().slice(0,10);
const PRE={Invoice:"INV",Quotation:"QUO"};
const numFor=(t,c)=>PRE[t]+"-"+String(c[t]).padStart(4,"0");
const fresh=()=>({type:"Invoice",no:"INV-0001",cnt:{Invoice:1,Quotation:1},date:today,due:"",biz:"",bizInfo:"",logo:"",cust:{name:"",info:""},items:[{d:"",q:1,p:0}],tax:0,disc:0,dm:"%",cur:"USD",notes:"",tpl:"classic",acc:"#0f8a5f",customers:[]});
let S;try{S=Object.assign(fresh(),JSON.parse(localStorage.getItem(K)||"{}"))}catch(e){S=fresh()}
const msg=t=>{$("#msg").textContent=t;if(t)setTimeout(()=>{$("#msg").textContent=""},4000)};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){msg("Could not save. The logo may be too large.")}};
const get=(p)=>p.split(".").reduce((o,k)=>o[k],S);
const set=(p,v)=>{const a=p.split(".");const l=a.pop();a.reduce((o,k)=>o[k],S)[l]=v};
const h=(t,c,x,p)=>{const n=document.createElement(t);if(c)n.className=c;if(x!=null)n.textContent=x;if(p)p.appendChild(n);return n};

$$("[data-k]").forEach(i=>{i.value=get(i.dataset.k);i.oninput=()=>{let v=i.value;if(i.type==="number")v=parseFloat(v)||0;set(i.dataset.k,v);
 if(i.dataset.k==="type"){S.no=numFor(S.type,S.cnt);$('[data-k="no"]').value=S.no}
 save();draw()}});

function rows(){const w=$("#items");w.textContent="";S.items.forEach((it,n)=>{const r=h("div","item",null,w);
 const d=h("input",null,null,r);d.placeholder="Description";d.value=it.d;d.oninput=()=>{it.d=d.value;save();draw()};
 const q=h("input",null,null,r);q.type="number";q.min=0;q.step="any";q.value=it.q;q.setAttribute("aria-label","Quantity");q.oninput=()=>{it.q=parseFloat(q.value)||0;save();draw()};
 const p=h("input",null,null,r);p.type="number";p.min=0;p.step="any";p.value=it.p;p.setAttribute("aria-label","Price");p.oninput=()=>{it.p=parseFloat(p.value)||0;save();draw()};
 const x=h("button","ghost","×",r);x.setAttribute("aria-label","Remove item");x.onclick=()=>{S.items.splice(n,1);if(!S.items.length)S.items.push({d:"",q:1,p:0});save();rows();draw()}})}
$("#add").onclick=()=>{S.items.push({d:"",q:1,p:0});save();rows();draw()};

function custs(){const s=$("#saved");s.textContent="";h("option",null,"Choose a saved customer",s).value="";S.customers.forEach((c,i)=>{h("option",null,c.name,s).value=i})}
$("#saved").onchange=e=>{const c=S.customers[e.target.value];if(!c)return;S.cust={name:c.name,info:c.info};$$('[data-k^="cust."]').forEach(i=>i.value=get(i.dataset.k));save();draw()};
$("#savec").onclick=()=>{if(!S.cust.name.trim())return msg("Enter a customer name first.");S.customers=S.customers.filter(c=>c.name!==S.cust.name);S.customers.push({...S.cust});save();custs();msg("Customer saved.")};

$("#logo").onchange=e=>{const f=e.target.files[0];if(!f)return;if(f.size>400000){e.target.value="";return msg("Logo is over 400 KB. Choose a smaller image.")}
 const r=new FileReader();r.onload=()=>{S.logo=r.result;save();draw()};r.readAsDataURL(f)};
$("#rmlogo").onclick=()=>{S.logo="";$("#logo").value="";save();draw()};
$("#print").onclick=()=>{try{window.print()}catch(e){msg("Printing is blocked here. Open the page in its own tab and try again.")}};
$("#next").onclick=()=>{S.cnt[S.type]++;S.no=numFor(S.type,S.cnt);S.cust={name:"",info:""};S.items=[{d:"",q:1,p:0}];S.notes="";S.date=today;S.due="";
 $$("[data-k]").forEach(i=>i.value=get(i.dataset.k));save();rows();draw();msg("Ready for "+S.no+".")};

function draw(){const p=$("#paper");p.textContent="";p.dataset.t=S.tpl;p.style.setProperty("--pa",S.acc);
 $("#duel").textContent=S.type==="Invoice"?"Due date":"Valid until";
 const money=n=>{try{return new Intl.NumberFormat(undefined,{style:"currency",currency:S.cur}).format(n)}catch(e){return n.toFixed(2)}};
 const head=h("div","ph",null,p),l=h("div",null,null,head);
 if(S.logo){const i=h("img",null,null,l);i.src=S.logo;i.alt="Logo"}
 h("h2",null,S.biz||"Your business",l);h("div","pre",S.bizInfo,l);
 const m=h("div","meta",null,head);h("b",null,S.type,m);h("div",null,S.no,m);h("div",null,"Date: "+(S.date||"-"),m);if(S.due)h("div",null,(S.type==="Invoice"?"Due: ":"Valid until: ")+S.due,m);
 const b=h("div","bt",null,p);h("small",null,S.type==="Invoice"?"Billed to":"Prepared for",b);h("b",null,S.cust.name||"Customer name",b);h("div","pre",S.cust.info,b);
 const t=h("table",null,null,p),hr=h("tr",null,null,h("thead",null,null,t));["Description","Qty","Price","Amount"].forEach((c,i)=>{const th=h("th",i?"n":null,c,hr)});
 const tb=h("tbody",null,null,t);let sub=0;
 S.items.forEach(it=>{const a=it.q*it.p;sub+=a;const r=h("tr",null,null,tb);h("td",null,it.d||"-",r);h("td","n",it.q,r);h("td","n",money(it.p),r);h("td","n",money(a),r)});
 let d=S.dm==="%"?sub*S.disc/100:Math.min(S.disc,sub);const tx=(sub-d)*S.tax/100,tot=sub-d+tx;
 const T=h("div","tot",null,p);const line=(a,b,c)=>{const r=h("div",c||"",null,T);h("span",null,a,r);h("span",null,b,r)};
 line("Subtotal",money(sub));if(d)line("Discount","-"+money(d));if(S.tax)line("Tax ("+S.tax+"%)",money(tx));line("Total",money(tot),"g");
 if(S.notes)h("div","notes pre",S.notes,p)}
custs();rows();draw();
</script>
</body>
</html>
